const SET_SIZE = 20;
const K_LEARNED = 'yojiApp_learned', K_ACCENT = 'yojiApp_accent', K_SKIP = 'yojiApp_skipLearned';

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let learned = load(K_LEARNED, {});
let accentUser = load(K_ACCENT, {});
let skipLearned = load(K_SKIP, true);
let state = { screen:'home', set:0, list:[], idx:0, editAccent:false };

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setCount = Math.ceil(DATA.length / SET_SIZE);
const setItems = n => DATA.slice(n*SET_SIZE, (n+1)*SET_SIZE);

// 読みを拍（モーラ）に分割：小書きの「ゃゅょぁぃぅぇぉゎ」は前の字と1拍
function toMora(r){
  const small = 'ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ';
  const out = [];
  for (const ch of r){ if (small.includes(ch) && out.length) out[out.length-1] += ch; else out.push(ch); }
  return out;
}
function getAccent(item){
  if (accentUser[item.id]) return accentUser[item.id];
  return item.accent; // null = 記載なし
}

function render(){
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'study') renderStudy();
  window.scrollTo(0,0);
}

function renderHome(){
  let html = `<h1>四字熟語 学習帳</h1><div class="sub">漢検準2級・全${DATA.length}語／${SET_SIZE}語ずつ${setCount}セット</div>
  <label class="opt"><input type="checkbox" id="skip" ${skipLearned?'checked':''}> 「覚えた」語を除いて学習する</label>
  <div class="sets">`;
  for (let s=0; s<setCount; s++){
    const items = setItems(s), n = items.filter(i => learned[i.id]).length;
    const first = items[0].id, last = items[items.length-1].id;
    html += `<button class="set ${n===items.length?'done':''}" data-set="${s}"><b>セット${s+1}</b><small>No.${first}〜${last}　覚えた ${n}/${items.length}</small><div class="bar"><i style="width:${n/items.length*100}%"></i></div></button>`;
  }
  const total = DATA.filter(i => learned[i.id]).length;
  html += `</div>
  <div class="tools">覚えた語：${total} / ${DATA.length}<br>
  <button id="exp">学習記録を書き出す</button><button id="imp">学習記録を読み込む</button>
  <input type="file" id="file" accept="application/json,.json" style="display:none"></div>`;
  app.innerHTML = html;
  document.getElementById('skip').onchange = e => { skipLearned = e.target.checked; save(K_SKIP, skipLearned); };
  app.querySelectorAll('[data-set]').forEach(b => b.onclick = () => startSet(+b.dataset.set));
  document.getElementById('exp').onclick = exportData;
  document.getElementById('imp').onclick = () => document.getElementById('file').click();
  document.getElementById('file').onchange = importData;
}

function startSet(s){
  let list = setItems(s);
  if (skipLearned) list = list.filter(i => !learned[i.id]);
  state = { screen:'study', set:s, list, idx:0, editAccent:false };
  render();
}

function renderStudy(){
  const { list, idx, set } = state;
  const item = list[idx];
  if (!item){
    const hasNext = set + 1 < setCount;
    app.innerHTML = `<div class="top"><button class="back" id="back">‹ セット一覧</button></div>
      <div class="center"><p>${list.length ? 'セット'+(set+1)+' 完了' : 'このセットはすべて「覚えた」です'}</p>
      <button class="big" id="again">もう一度</button>${hasNext?'<button class="big" id="nextset">次のセットへ</button>':''}</div>`;
    document.getElementById('back').onclick = goHome;
    document.getElementById('again').onclick = () => startSet(set);
    if (hasNext) document.getElementById('nextset').onclick = () => startSet(set+1);
    return;
  }
  const mora = toMora(item.reading);
  const acc = getAccent(item);
  const accSet = new Set(acc || []);
  const showDots = acc || state.editAccent;
  const reading = mora.map((m,i) => `<span class="mora" data-m="${i}"><span class="dot">${showDots && accSet.has(i) ? '・' : '&nbsp;'}</span>${esc(m)}</span>`).join('');
  let accNote = state.editAccent ? '高く発音する拍をタップしてください' : (acc ? (accentUser[item.id] ? 'アクセント（手入力）' : 'アクセント') : 'アクセント：記載なし');
  const ex = esc(item.example).split(esc(item.answer)).join(`<mark>${esc(item.answer)}</mark>`);
  app.innerHTML = `<div class="top"><button class="back" id="back">‹ セット一覧</button>
    <div style="margin-left:auto;color:#6b7280;font-size:14px">セット${set+1}　${idx+1} / ${list.length}</div></div>
  <div class="card">
    <div class="reading ${state.editAccent?'editing':''}" id="reading">${reading}</div>
    <div class="acc-note">${accNote}</div>
    <div class="word">${esc(item.answer)}</div>
    <div class="meaning">${esc(item.meaning)}</div>
    <div class="sec"><h3>語源・出典</h3><p class="${item.origin?'':'none'}">${item.origin ? esc(item.origin) : '記載なし'}</p></div>
    <div class="sec ex"><h3>覚え方例文</h3><p>${ex}</p></div>
  </div>
  <div class="nav"><button class="next" id="next">次へ</button>${idx>0?'<button class="prev" id="prev">前へ</button>':''}</div>
  <label class="learned"><input type="checkbox" id="lrn" ${learned[item.id]?'checked':''}> 覚えた</label>
  <div class="small-btns"><button id="edit" class="${state.editAccent?'on':''}">${state.editAccent?'アクセント入力を終える':'アクセントを入力'}</button>
  ${accentUser[item.id]?'<button id="clr">手入力を消す</button>':''}</div>`;
  document.getElementById('back').onclick = goHome;
  document.getElementById('next').onclick = () => { state.idx++; state.editAccent=false; render(); };
  if (idx>0) document.getElementById('prev').onclick = () => { state.idx--; state.editAccent=false; render(); };
  document.getElementById('lrn').onchange = e => { if (e.target.checked) learned[item.id] = true; else delete learned[item.id]; save(K_LEARNED, learned); };
  document.getElementById('edit').onclick = () => { state.editAccent = !state.editAccent; render(); };
  const clr = document.getElementById('clr');
  if (clr) clr.onclick = () => { delete accentUser[item.id]; save(K_ACCENT, accentUser); render(); };
  if (state.editAccent){
    app.querySelectorAll('[data-m]').forEach(el => el.onclick = () => {
      const i = +el.dataset.m;
      const cur = new Set(accentUser[item.id] || item.accent || []);
      cur.has(i) ? cur.delete(i) : cur.add(i);
      if (cur.size) accentUser[item.id] = [...cur].sort((a,b)=>a-b); else delete accentUser[item.id];
      save(K_ACCENT, accentUser); render();
    });
  }
}

function goHome(){ state = { screen:'home', set:0, list:[], idx:0, editAccent:false }; render(); }

function exportData(){
  const blob = new Blob([JSON.stringify({ app:'yojiApp', date:new Date().toISOString(), learned, accent:accentUser }, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yoji-record-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(e){
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (d.learned) { learned = d.learned; save(K_LEARNED, learned); }
      if (d.accent) { accentUser = d.accent; save(K_ACCENT, accentUser); }
      render();
    }catch(err){ document.querySelector('.tools').insertAdjacentHTML('beforeend','<div style="color:#dc2626;margin-top:6px">読み込みに失敗しました（形式が違います）</div>'); }
  };
  r.readAsText(f);
}

render();
</script>
</body>
</html>
